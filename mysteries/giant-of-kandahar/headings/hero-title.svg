<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-label="THE GIANT OF KANDAHAR">
  <defs>
    <linearGradient id="bronze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0dfb5"/>
      <stop offset="0.18" stop-color="#d8bd80"/>
      <stop offset="0.48" stop-color="#a98245"/>
      <stop offset="0.72" stop-color="#76512c"/>
      <stop offset="1" stop-color="#d1b06d"/>
    </linearGradient>
    <pattern id="grain" width="86" height="54" patternUnits="userSpaceOnUse">
      <path d="M4 10L31 7M45 18L80 13M12 39L53 34M61 47L83 44" stroke="#5f3f23" stroke-width="2" opacity=".36"/>
      <circle cx="19" cy="21" r="2.6" fill="#f3e4bf" opacity=".48"/>
      <circle cx="67" cy="31" r="3.2" fill="#3f2918" opacity=".5"/>
    </pattern>
    <filter id="depth" x="-10%" y="-20%" width="120%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.2" result="blur"/>
      <feOffset in="blur" dx="0" dy="5" result="offset"/>
      <feFlood flood-color="#130b05" flood-opacity=".96" result="shade"/>
      <feComposite in="shade" in2="offset" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .title{font-family:Cinzel,Georgia,serif;font-size:128px;font-weight:700;letter-spacing:.025em;fill:url(#bronze);stroke:#1b0f07;stroke-width:4;paint-order:stroke fill;filter:url(#depth)}
      .weather{fill:url(#grain);mix-blend-mode:multiply;opacity:.5}
    </style>
    <mask id="letters">
      <rect width="100%" height="100%" fill="#000"/>
      <text x="500" y="132" text-anchor="middle" font-family="Cinzel,Georgia,serif" font-size="128px" font-weight="700" letter-spacing=".025em" fill="#fff" textLength="790" lengthAdjust="spacingAndGlyphs">THE GIANT OF</text><text x="500" y="278" text-anchor="middle" font-family="Cinzel,Georgia,serif" font-size="128px" font-weight="700" letter-spacing=".025em" fill="#fff" textLength="720" lengthAdjust="spacingAndGlyphs">KANDAHAR</text>
    </mask>
  </defs>
  <text x="500" y="132" text-anchor="middle" class="title" textLength="790" lengthAdjust="spacingAndGlyphs">THE GIANT OF</text>
  <text x="500" y="278" text-anchor="middle" class="title" textLength="720" lengthAdjust="spacingAndGlyphs">KANDAHAR</text>
  <rect class="weather" width="100%" height="100%" mask="url(#letters)"/>
</svg>
