name: Video Release Control

'on':
  workflow_dispatch:
    inputs:
      state:
        description: Goliath companion film
        required: true
        default: 'off'
        type: choice
        options:
          - 'off'
          - 'on'
      video_url:
        description: Facebook Reel or YouTube URL - paste once, then leave blank
        required: false
        type: string

permissions:
  contents: write

jobs:
  goliath-pilot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update Goliath release state
        env:
          STATE: ${{ inputs.state }}
          VIDEO_URL_INPUT: ${{ inputs.video_url }}
        run: python3 scripts/video-release-control.py

      - name: Commit Goliath switch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/video-releases.json index.html mysteries/goliath-of-gath/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Goliath video: ${{ inputs.state }}"
          git push origin main
