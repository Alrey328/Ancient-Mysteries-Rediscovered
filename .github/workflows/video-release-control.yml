name: Video Release Control

'on':
  workflow_dispatch:
    inputs:
      state:
        description: Kandahar Giant 2.0 companion film
        required: true
        default: 'off'
        type: choice
        options:
          - 'off'
          - 'on'
      video_url:
        description: Facebook Reel or YouTube URL - already saved; leave blank unless replacing it
        required: false
        type: string

permissions:
  contents: write

jobs:
  kandahar-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update Kandahar 2.0 release state
        env:
          STATE: ${{ inputs.state }}
          VIDEO_URL_INPUT: ${{ inputs.video_url }}
        run: python3 scripts/video-release-control.py

      - name: Commit Kandahar 2.0 switch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/video-releases.json index.html mysteries/giant-of-kandahar/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Kandahar Giant 2.0 video: ${{ inputs.state }}"
          git push origin main
